<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MedLink - Seamless Care. Absolute Privacy.{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: 'Inter', sans-serif;
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        /* Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.7;
            }
        }

        @keyframes heartbeat {
            0%, 100% {
                transform: scale(1);
            }
            10%, 30% {
                transform: scale(1);
            }
            25% {
                transform: scale(1.1);
            }
            35%, 60% {
                transform: scale(1);
            }
            55% {
                transform: scale(1.1);
            }
            70% {
                transform: scale(1);
            }
        }

        @keyframes shimmer {
            0% {
                background-position: -1000px 0;
            }
            100% {
                background-position: 1000px 0;
            }
        }

        .animate-fade-in-up {
            animation: fadeInUp 0.8s ease-out forwards;
        }

        .animate-fade-in {
            animation: fadeIn 0.6s ease-out forwards;
        }

        .animate-pulse-custom {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        .animate-heartbeat {
            animation: heartbeat 1.3s ease-in-out infinite;
        }

        /* Smooth transitions */
        button, a {
            transition: all 0.3s ease;
        }

        /* Glow effect for sign-in button */
        .btn-glow {
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.3);
            transition: all 0.3s ease;
        }

        .btn-glow:hover {
            box-shadow: 0 0 30px rgba(6, 182, 212, 0.5);
            transform: scale(1.05);
        }

        /* Card styles */
        .card-elevated {
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            transition: all 0.3s ease;
        }

        .card-elevated:hover {
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.12);
            transform: translateY(-4px);
        }

        /* Navbar transparency */
        .navbar-transparent {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }

        /* Stagger animation */
        .stagger-1 {
            animation-delay: 0.1s;
        }
        .stagger-2 {
            animation-delay: 0.2s;
        }
        .stagger-3 {
            animation-delay: 0.3s;
        }
        .stagger-4 {
            animation-delay: 0.4s;
        }

        /* Smooth button hover */
        .btn-primary {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-primary:hover {
            transform: scale(1.05);
        }

        /* Loading skeleton */
        .skeleton {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 1000px 100%;
            animation: shimmer 2s infinite;
        }

        /* Glassmorphism effect */
        .glass {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* Sidebar smooth scroll */
        .sidebar {
            transition: all 0.3s ease;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body class="bg-slate-50 relative overflow-x-hidden" style="background-color: #F8FAFC;">
    <!-- Neural Network Background Animation -->
    <canvas id="neural-network-bg" class="fixed inset-0 w-full h-full pointer-events-none" style="z-index: 0; opacity: 0.05;"></canvas>
    
    <div class="relative z-10">
        {% block content %}{% endblock %}
    </div>
    
    <script>
        // Intersection observer for fade-in-up animations
        const observerOptions = {
            threshold: 0.1,
            rootMargin: '0px 0px -100px 0px'
        };

        const observer = new IntersectionObserver(function(entries) {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('animate-fade-in-up');
                    observer.unobserve(entry.target);
                }
            });
        }, observerOptions);

        // Observe all elements with animation-trigger class
        document.querySelectorAll('.animation-trigger').forEach(el => {
            observer.observe(el);
        });
    </script>

    <!-- Neural Network Background Animation -->
    <script>
        class NeuralNetworkBG {
            constructor() {
                this.canvas = document.getElementById('neural-network-bg');
                if (!this.canvas) return;
                
                this.ctx = this.canvas.getContext('2d');
                this.width = window.innerWidth;
                this.height = window.innerHeight;
                this.canvas.width = this.width;
                this.canvas.height = this.height;
                
                this.nodes = [];
                this.connections = [];
                this.nodeCount = Math.floor((this.width * this.height) / 25000);
                
                this.initNodes();
                this.animate();
                
                window.addEventListener('resize', () => this.handleResize());
            }
            
            initNodes() {
                for (let i = 0; i < this.nodeCount; i++) {
                    this.nodes.push({
                        x: Math.random() * this.width,
                        y: Math.random() * this.height,
                        vx: (Math.random() - 0.5) * 0.5,
                        vy: (Math.random() - 0.5) * 0.5,
                        radius: Math.random() * 2 + 1,
                        color: this.getRandomColor(),
                        pulse: Math.random() * Math.PI * 2
                    });
                }
                
                this.createConnections();
            }
            
            createConnections() {
                this.connections = [];
                const maxDistance = 150;
                
                for (let i = 0; i < this.nodes.length; i++) {
                    for (let j = i + 1; j < this.nodes.length; j++) {
                        const dx = this.nodes[i].x - this.nodes[j].x;
                        const dy = this.nodes[i].y - this.nodes[j].y;
                        const distance = Math.sqrt(dx * dx + dy * dy);
                        
                        if (distance < maxDistance) {
                            this.connections.push({
                                from: i,
                                to: j,
                                distance: distance,
                                opacity: 1 - (distance / maxDistance)
                            });
                        }
                    }
                }
            }
            
            getRandomColor() {
                const colors = ['#06b6d4', '#0ea5e9', '#06b6d4', '#10b981', '#8b5cf6', '#ec4899'];
                return colors[Math.floor(Math.random() * colors.length)];
            }
            
            update() {
                for (let node of this.nodes) {
                    node.x += node.vx;
                    node.y += node.vy;
                    node.pulse += 0.01;
                    
                    // Wrap around edges
                    if (node.x < -10) node.x = this.width + 10;
                    if (node.x > this.width + 10) node.x = -10;
                    if (node.y < -10) node.y = this.height + 10;
                    if (node.y > this.height + 10) node.y = -10;
                    
                    // Slight drift
                    node.vx += (Math.random() - 0.5) * 0.1;
                    node.vy += (Math.random() - 0.5) * 0.1;
                    
                    // Speed limit
                    const speed = Math.sqrt(node.vx * node.vx + node.vy * node.vy);
                    if (speed > 1) {
                        node.vx /= speed;
                        node.vy /= speed;
                    }
                }
                
                this.createConnections();
            }
            
            draw() {
                this.ctx.clearRect(0, 0, this.width, this.height);
                
                // Draw connections
                for (let conn of this.connections) {
                    const from = this.nodes[conn.from];
                    const to = this.nodes[conn.to];
                    
                    this.ctx.strokeStyle = from.color;
                    this.ctx.globalAlpha = conn.opacity * 0.3;
                    this.ctx.lineWidth = 0.5;
                    this.ctx.beginPath();
                    this.ctx.moveTo(from.x, from.y);
                    this.ctx.lineTo(to.x, to.y);
                    this.ctx.stroke();
                }
                
                // Draw nodes
                this.ctx.globalAlpha = 1;
                for (let node of this.nodes) {
                    const pulse = Math.sin(node.pulse) * 0.5 + 0.5;
                    const size = node.radius * (0.8 + pulse * 0.4);
                    
                    // Glow
                    this.ctx.shadowBlur = 10;
                    this.ctx.shadowColor = node.color;
                    
                    this.ctx.fillStyle = node.color;
                    this.ctx.beginPath();
                    this.ctx.arc(node.x, node.y, size, 0, Math.PI * 2);
                    this.ctx.fill();
                    
                    this.ctx.shadowBlur = 0;
                }
            }
            
            animate() {
                this.update();
                this.draw();
                requestAnimationFrame(() => this.animate());
            }
            
            handleResize() {
                this.width = window.innerWidth;
                this.height = window.innerHeight;
                this.canvas.width = this.width;
                this.canvas.height = this.height;
            }
        }
        
        // Initialize neural network animation when page loads
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => {
                new NeuralNetworkBG();
            });
        } else {
            new NeuralNetworkBG();
        }
    </script>

    {% block extra_js %}{% endblock %}
</body>
</html>
