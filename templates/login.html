{% extends "base.html" %}

{% block title %}Sign In - MedLink{% endblock %}

{% block content %}
<div class="min-h-screen bg-gradient-to-br from-slate-50 to-blue-50 flex items-center justify-center px-4 py-12" style="background: linear-gradient(135deg, #F8FAFC 0%, #F0F9FF 100%);">
    <div class="w-full max-w-md">
        <!-- Login Card -->
        <div class="card-elevated bg-white rounded-3xl p-8 animate-fade-in-up">
            <!-- Logo -->
            <div class="flex items-center justify-center mb-8">
                <div class="w-12 h-12 bg-gradient-to-br from-cyan-500 to-teal-600 rounded-lg flex items-center justify-center mr-3">
                    <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path>
                    </svg>
                </div>
                <span class="text-2xl font-bold text-slate-900" style="font-family: 'Plus Jakarta Sans', sans-serif;">MedLink</span>
            </div>

            <!-- Heading -->
            <h1 class="text-3xl font-bold text-slate-900 text-center mb-2" style="font-family: 'Plus Jakarta Sans', sans-serif;">
                Secure Sign In
            </h1>
            <p class="text-center text-slate-600 mb-8">
                Enter your credentials to access your portal
            </p>

            <!-- Error Message -->
            {% if error %}
            <div class="mb-6 p-4 bg-red-50 border border-red-200 rounded-lg">
                <p class="text-sm text-red-700">{{ error }}</p>
            </div>
            {% endif %}

            <!-- Login Form -->
            <form method="POST" action="{{ url_for('login') }}" class="space-y-5">
                <!-- Username Field -->
                <div>
                    <label for="username" class="block text-sm font-semibold text-slate-900 mb-2">
                        Full Name
                    </label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        required 
                        class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:border-transparent transition"
                        placeholder="John Doe"
                    >
                </div>

                <!-- Password Field -->
                <div>
                    <label for="password" class="block text-sm font-semibold text-slate-900 mb-2">
                        Password
                    </label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        required 
                        class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:border-transparent transition"
                        placeholder="••••••••"
                    >
                </div>

                <!-- Remember Me & Forgot Password -->
                <div class="flex items-center justify-between">
                    <label class="flex items-center">
                        <input type="checkbox" class="w-4 h-4 rounded border-slate-300 text-cyan-600 focus:ring-cyan-500">
                        <span class="ml-2 text-sm text-slate-700">Remember me</span>
                    </label>
                    <a href="#" class="text-sm text-cyan-600 hover:text-cyan-700 font-medium">
                        Forgot password?
                    </a>
                </div>

                <!-- Sign In Button -->
                <button 
                    type="submit" 
                    class="btn-primary w-full py-3 bg-gradient-to-r from-cyan-500 to-teal-600 text-white rounded-xl font-semibold hover:shadow-lg"
                >
                    Sign In
                </button>
            </form>

            <!-- Sign Up Link -->
            <div class="mt-8 text-center">
                <p class="text-sm text-slate-600">
                    Don't have an account?
                    <a href="{{ url_for('register') }}" class="text-cyan-600 hover:text-cyan-700 font-semibold">
                        Create one here
                    </a>
                </p>
            </div>

            <!-- Back to Home -->
            <div class="mt-4 text-center">
                <a href="{{ url_for('index') }}" class="text-sm text-slate-600 hover:text-slate-900 font-medium">
                    ← Back to Home
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
